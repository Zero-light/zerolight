<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="60%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>
    <radialGradient id="dot" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F6E3B4"/>
      <stop offset="45%" stop-color="#F0C98A"/>
      <stop offset="100%" stop-color="#C99A55"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
    <radialGradient id="gridFade" cx="50%" cy="40%" r="75%">
      <stop offset="30%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#E9E6DE" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- 同心圆环标志 -->
  <g transform="translate(600,300)">
    <circle r="150" fill="none" stroke="#F0C98A" stroke-opacity="0.14" stroke-width="1"/>
    <circle r="105" fill="none" stroke="#F0C98A" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle r="57" fill="url(#dot)"/>
    <circle r="57" fill="none" stroke="#F0C98A" stroke-opacity="0.45" stroke-width="1"/>
    <ellipse cx="-18" cy="-18" rx="30" ry="22" fill="#fff" fill-opacity="0.16"/>
  </g>

  <!-- 字标 -->
  <text x="600" y="520" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="80" font-weight="600" fill="#F0C98A" letter-spacing="2">zerolight</text>
  <text x="600" y="566" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#8A887F" letter-spacing="11">以光为尺 · 设计克制</text>

  <!-- 角标 -->
  <text x="56" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#55544E" letter-spacing="6">EST. 2026</text>
  <text x="1144" y="572" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" fill="#55544E" letter-spacing="4">WWW.ZEROLIGHT.FUN</text>
</svg>
